# C# 单进程部署；POSTGRES_URL 必须指向已执行 0001～0006 迁移的数据库。
# 回滚时选择 deploy/Dockerfile，并沿用已备份的 Node 环境配置。
services:
  - type: web
    name: forgex-insight
    runtime: docker
    plan: starter
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: forgex-job-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: POSTGRES_URL
        sync: false
      - key: PublicFacade__TrustProxy
        value: "true"
      - key: PublicFacade__PublicBase
        sync: false
      - key: DirectAuth__ApiKeys
        sync: false
      - key: DirectAuth__RequireAuth
        value: "true"
      # 默认不配置云端 AI 密钥，仅使用本地规则引擎，无外部计费。
      # 启用云端 AI 前请按 .github/SECURITY.md 配置鉴权、额度与并发保护。
      # AI 可在控制台配置 OpenAi__ApiKey / OpenAi__BaseUrl / OpenAi__Model，
      # 也可由用户在工作台提供；内部通道密钥不注入浏览器构建。
