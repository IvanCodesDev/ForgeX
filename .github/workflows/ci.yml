name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 关键约束：运行本项目不需要 npm install。
  # 这个 job 刻意不装任何依赖——一旦有人给运行时代码引入 npm 依赖，这里会红。
  test-zero-deps:
    name: Test (no install) · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 确认无 node_modules（运行时零依赖）
        run: |
          if [ -d node_modules ]; then
            echo "::error::node_modules 不应存在于此 job — 运行时必须零依赖"
            exit 1
          fi

      - name: 跑测试（不 install）
        run: npm test

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装开发工具链
        run: npm install --no-audit --no-fund

      - run: npm run lint

      - run: npm run format:check

  honesty:
    name: 诚实性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 密钥不得入库
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env 文件不得提交"
            exit 1
          fi
          if git grep -nIE 'sk-[a-zA-Z0-9]{16,}' -- . ':!*.md'; then
            echo "::error::疑似 API key 硬编码在代码中"
            exit 1
          fi

      - name: 规则引擎不得自称 AI
        run: |
          # 用户可见文案里，"AI" 只能出现在真 provider 相关的位置。
          # 这里做一个粗粒度守卫：规则引擎的标识附近不得出现 AI 字样。
          if git grep -nE '(local-rules|server-rules)[^\n]*\bAI\b' -- 'js/*.js' 'server/**/*.js' \
             | grep -v '无 AI' | grep -v '不是 AI' | grep -v '非 AI'; then
            echo "::error::规则引擎标识附近出现了未加否定词的 AI 字样"
            exit 1
          fi

      - name: 合成数据必须自我声明
        run: |
          node -e "
            require('./js/util.js'); require('./js/insight-data.js');
            const D = globalThis.FXInsightData;
            const p = D.PROVENANCE.sample;
            if (p.synthetic !== true) { console.error('内置示例数据集必须标记 synthetic:true'); process.exit(1); }
            if (!p.generator || !p.generator.seed) { console.error('合成数据必须带生成器与种子（可复现）'); process.exit(1); }
            console.log('OK: 内置数据集已声明为合成，seed =', p.generator.seed);
          "

      - name: 成本闸门必须真的能拦下超额调用
        run: |
          node -e "
            const os = require('os'), fs = require('fs'), path = require('path');
            const { CostGate } = require('./server/lib/quota.js');
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'ci-gate-'));
            const quiet = { info(){}, warn(){}, error(){} };
            const g = new CostGate({ dataDir: dir, aiConcurrency: 1, aiQueueMax: 1, dailyPerCaller: 2, dailyGlobal: 3 }, quiet);
            if (!g.check('ip:1').ok) { console.error('初始应有额度'); process.exit(1); }
            g.consume('ip:1'); g.consume('ip:1');
            if (g.check('ip:1').ok) { console.error('额度用尽后仍放行 —— 闸门失效'); process.exit(1); }
            const g2 = new CostGate({ dataDir: dir, aiConcurrency: 1, aiQueueMax: 1, dailyPerCaller: 2, dailyGlobal: 3 }, quiet);
            if (g2.usedBy('ip:1') !== 2) { console.error('用量未跨重启保留 —— 重启即可重置额度'); process.exit(1); }
            fs.rmSync(dir, { recursive: true, force: true });
            console.log('OK: 闸门可拦截，用量跨重启保留');
          "

      - name: 运行时数据不得入库
        run: |
          if git ls-files | grep -E '^data/'; then
            echo "::error::data/ 是用户运行时数据，不该提交"
            exit 1
          fi
          echo "OK: 无运行时数据入库"

      - name: 统计结论必须带证据
        run: |
          node -e "
            require('./js/util.js'); require('./js/stats-kernel.js');
            require('./js/insight-data.js'); require('./js/insight-engine.js');
            const E = globalThis.FXInsightEngine;
            const mk = (m,n,f) => Array.from({length:n},(_,i)=>({machine_id:m,status:i<f?'fail':'success',
              fail_reason:i<f?'堵料':'',date:'2026-07-01',duration_min:100,layer_height_mm:0.2,
              material:'PLA',model_name:'X',cost_fen:300,filament_g:30,energy_kwh:0.4}));
            const r = E.analyze('哪台机故障率最高', mk('BAD',20,8).concat(mk('OK',20,1)));
            if (!Array.isArray(r.evidence) || !r.evidence.length) { console.error('结论未附计算依据'); process.exit(1); }
            if (!r.evidence.every(e => e.method && e.n != null)) { console.error('evidence 缺 method 或 n'); process.exit(1); }
            const weak = E.analyze('哪台机故障率最高', mk('A',20,5).concat(mk('B',20,4)));
            if (weak.verdict.indexOf('未达统计显著') < 0) { console.error('噪声差异未如实标注为不显著'); process.exit(1); }
            if (weak.confidence !== 'low') { console.error('噪声差异的可信度未降级'); process.exit(1); }
            console.log('OK: 结论带证据，不显著时如实告知');
          "

      - name: 内置数据集不得由概率抽样产生
        run: |
          node -e "
            require('./js/util.js'); require('./js/farm-dataset.js'); require('./js/insight-data.js');
            const F = globalThis.FXFarmDataset;
            if (!F || !F.rows().length) { console.error('内置机群数据集缺失'); process.exit(1); }
            if (F.generator !== 'tools/farm-sim.js') { console.error('内置数据集必须由物理仿真产出'); process.exit(1); }
            const D = globalThis.FXInsightData;
            if (D.PROVENANCE.farm.source !== 'sim-farm') { console.error('内置数据集来源标记错误'); process.exit(1); }
            console.log('OK: 内置数据集由物理仿真产出，seed =', F.seed, '行数 =', F.rows().length);
          "

      - name: 知识库能力标记必须与实际 provider 一致
        run: |
          node -e "
            const { createApp } = require('./server/index.js');
            const app = createApp({ logLevel: 'error', forceMock: true, rateLimitMs: 0 });
            const p = app.ctx.tasks.provider;
            if (p.capabilities.ai !== false) { console.error('规则引擎不应声称有 AI 能力'); process.exit(1); }
            const { retrieve } = require('./server/services/retrieval.js');
            const hits = retrieve([{ id: 'k1', name: '术语表', text: '翘边：首层附着失效导致边缘翘起。' }], '翘边怎么办');
            if (!hits.length) { console.error('检索未命中明显相关的文档'); process.exit(1); }
            const none = retrieve([{ id: 'k1', name: '术语表', text: '翘边：首层附着失效。' }], 'zzz quantum foobar');
            if (none.length) { console.error('无关问题不应返回片段'); process.exit(1); }
            console.log('OK: 能力标记一致，检索有命中也有拒绝');
            app.close();
          "

  e2e:
    name: E2E（DOM 层）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装工具链与浏览器
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # 覆盖 ui.js / insight.js 这两块纯逻辑测试够不到的地方：
      # 「打不开」「点了没反应」「界面说了假话」
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
