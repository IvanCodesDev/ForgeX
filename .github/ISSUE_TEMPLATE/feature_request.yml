name: 功能建议 / Feature request
description: 建议一个新能力
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 issue 和讨论，确认没有相同建议；如有，欢迎补充你的使用场景与证据。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题 / What problem are you solving
      description: 请描述场景而不是方案。「我需要 X 功能」不如「我在做 Y 的时候卡在 Z」有用。
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法 / Your proposed approach
      description: 可选。如果已经有想法，说说看。

  - type: dropdown
    id: area
    attributes:
      label: 涉及哪块 / Area
      multiple: true
      options:
        - "3D 仿真 / 运动学"
        - "切片引擎"
        - "导出（STL / OBJ / G-code）"
        - "数据分析引擎"
        - "数据接入 / CSV"
        - "后端 API"
        - "UI / 交互"
        - "文档 / 示例"
        - "其他"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 自检 / Checklist
      options:
        - label: 我已搜索现有 issue 和讨论，这不是重复建议（或我在补充已有建议的场景）
        - label: 如果涉及机型/材料参数，我能提供参数出处
