name: 功能建议 / Feature request
description: 建议一个新能力
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前请先看一眼 [`doc/优化文档.md`](../blob/main/doc/优化文档.md) 的路线图（P1–P5），
        很多能力已经在计划里了——如果是，欢迎在对应条目下补充你的场景，这比新开 issue 更有用。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题 / What problem are you solving
      description: 请描述场景而不是方案。「我需要 X 功能」不如「我在做 Y 的时候卡在 Z」有用。
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法 / Your proposed approach
      description: 可选。如果已经有想法，说说看。

  - type: dropdown
    id: area
    attributes:
      label: 涉及哪块 / Area
      multiple: true
      options:
        - "3D 仿真 / 运动学"
        - "切片引擎"
        - "导出（STL / OBJ / G-code）"
        - "数据分析引擎"
        - "数据接入 / CSV"
        - "后端 API"
        - "UI / 交互"
        - "文档 / 示例"
        - "其他"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 自检 / Checklist
      options:
        - label: 我看过路线图，这不是已经计划中的条目（或我在补充计划条目的场景）
        - label: 如果涉及机型/材料参数，我能提供参数出处
