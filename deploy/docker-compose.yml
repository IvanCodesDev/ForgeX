name: forgex

services:
  forgex-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: "${FORGEX_API_IMAGE:-forgex-authority:local}"
    restart: unless-stopped
    user: "1654:1654"
    expose:
      - "8788"
    volumes:
      - forgex-authority-data:/app/data
    environment:
      Kestrel__Endpoints__Http__Url: "http://0.0.0.0:8788"
      # 网关经服务别名访问，Host 头为 forgex-api；不加入白名单会被主机过滤拒为 400。
      AllowedHosts: "localhost;127.0.0.1;forgex-api"
      # Stage 8 工作项 5：ForgeX.Api 已支持 StaticHosting__Enabled/StaticHosting__Root
      # 静态托管（默认关闭）。本编排仍由 forgex(Node) 服务承担静态与入口；
      # 切换单进程交付随工作项 6「Node 退场」收口，此处暂不启用。
      Storage__Root: "/app/data"
      Persistence__Provider: "file"
      # Stage 8.6a：C# 资源存储腿（分享 / 数据源 / 知识库 / 校准治理）默认 disabled = 不注册端点、
      # 行为与迁移前一致。切 C# 权威时先把对应 Provider 置 file（落 /app/data）或 postgres
      # （与 Node 共用同一 POSTGRES_URL、同表同 RLS），再把下方 Node 侧 *_AUTHORITY 切到 csharp。
      Shares__Provider: "${CSHARP_SHARES_PROVIDER:-disabled}"
      Datasources__Provider: "${CSHARP_DATASOURCES_PROVIDER:-disabled}"
      Knowledge__Provider: "${CSHARP_KNOWLEDGE_PROVIDER:-disabled}"
      Calibrations__Provider: "${CSHARP_CALIBRATIONS_PROVIDER:-disabled}"
      # Stage 8.6c-1：分析任务历史只读腿只有 postgres（读 Node 落库的 forgex.node_analysis_tasks），
      # 与 Node 的 ANALYSIS_TASKS_AUTHORITY=csharp 配套；PERSISTENCE_PROVIDER 必须同时是 postgres。
      AnalysisTasks__Provider: "${CSHARP_ANALYSIS_TASKS_PROVIDER:-disabled}"
      POSTGRES_URL: "${POSTGRES_URL:-}"
      InternalAuth__SharedSecret: "${GCODE_AUTHORITY_INTERNAL_SECRET:?Set a random secret of at least 32 bytes}"
      InternalAuth__PreviousSharedSecret: "${GCODE_AUTHORITY_INTERNAL_SECRET_PREVIOUS:-}"
      GCodeJobs__QueueCapacity: "${GCODE_JOB_QUEUE_CAPACITY:-64}"
      GCodeJobs__Admission__MaxActivePerOwner: "${GCODE_JOB_MAX_ACTIVE_PER_OWNER:-4}"
      GCodeJobs__Admission__MaxActivePerTenant: "${GCODE_JOB_MAX_ACTIVE_PER_TENANT:-16}"
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft.AspNetCore: "Warning"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=/dev/null",
          "http://127.0.0.1:8788/health/ready",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  forgex:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: "${FORGEX_NODE_IMAGE:-forgex-insight:local}"
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      forgex-api:
        condition: service_healthy
    ports:
      - "${FORGEX_PORT:-8787}:8787"
    volumes:
      - forgex-node-data:/app/data
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      NODE_ENV: "production"
      DATA_DIR: "/app/data"
      PERSISTENCE_PROVIDER: "${PERSISTENCE_PROVIDER:-file}"
      POSTGRES_URL: "${POSTGRES_URL:-}"
      POSTGRES_POOL_MAX: "${POSTGRES_POOL_MAX:-10}"
      POSTGRES_SSL: "${POSTGRES_SSL:-0}"
      LOG_LEVEL: "info"
      TRUST_PROXY: "0"
      GCODE_AUTHORITY_URL: "http://forgex-api:8788"
      GCODE_AUTHORITY_ALLOW_REMOTE: "1"
      GCODE_AUTHORITY_INTERNAL_SECRET: "${GCODE_AUTHORITY_INTERNAL_SECRET:?Set a random secret of at least 32 bytes}"
      GCODE_ASYNC_JOBS_ENABLED: "1"
      # Stage 8.1 / 8.6a：按资源逐个切流的迁移期开关，默认 node（零变化）；csharp 经上面的
      # GCODE_AUTHORITY_URL 可信通道代理到 forgex-api，任一资源异常改回 node 重启即回滚。
      SHARES_AUTHORITY: "${SHARES_AUTHORITY:-node}"
      DATASOURCES_AUTHORITY: "${DATASOURCES_AUTHORITY:-node}"
      KNOWLEDGE_AUTHORITY: "${KNOWLEDGE_AUTHORITY:-node}"
      CALIBRATION_GOVERNANCE_AUTHORITY: "${CALIBRATION_GOVERNANCE_AUTHORITY:-node}"
      # Stage 8.6c-1：分析任务只读切流——csharp 时 GET result / 轮询读 forgex-api 的任务快照，
      # 创建与 SSE 仍在 Node；要求 PERSISTENCE_PROVIDER=postgres 且 CSHARP_ANALYSIS_TASKS_PROVIDER=postgres。
      ANALYSIS_TASKS_AUTHORITY: "${ANALYSIS_TASKS_AUTHORITY:-node}"
      AI_CONCURRENCY: "2"
      AI_QUEUE_MAX: "8"
      AI_DAILY_PER_CALLER: "20"
      AI_DAILY_GLOBAL: "200"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  forgex-node-data:
  forgex-authority-data:
