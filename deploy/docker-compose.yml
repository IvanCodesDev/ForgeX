name: forgex

services:
  forgex-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: "${FORGEX_API_IMAGE:-forgex-authority:local}"
    restart: unless-stopped
    user: "1654:1654"
    ports:
      - "${FORGEX_PORT:-8787}:8787"
    volumes:
      - forgex-authority-data:/app/data
    environment:
      Kestrel__Endpoints__Http__Url: "http://0.0.0.0:8787"
      # 公网域名可通过 FORGEX_ALLOWED_HOSTS 限定（分号分隔）。
      AllowedHosts: "${FORGEX_ALLOWED_HOSTS:-*}"
      StaticHosting__Enabled: "true"
      StaticHosting__Root: "/app/wwwroot"
      PublicFacade__Enabled: "true"
      PublicFacade__TrustProxy: "${TRUST_PROXY:-false}"
      PublicFacade__AllowOrigins: "${ALLOW_ORIGINS:-}"
      PublicFacade__PublicBase: "${PUBLIC_BASE:-}"
      DirectAuth__ApiKeys: "${API_KEYS:-}"
      DirectAuth__CalibrationReviewKeys: "${CALIBRATION_REVIEW_KEYS:-}"
      DirectAuth__RequireAuth: "${REQUIRE_AUTH:-false}"
      Analysis__Provider: "${ANALYSIS_PROVIDER:-auto}"
      OpenAi__BaseUrl: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OpenAi__ApiKey: "${OPENAI_API_KEY:-}"
      OpenAi__Model: "${OPENAI_MODEL:-}"
      Analysis__AiConcurrency: "${AI_CONCURRENCY:-2}"
      Analysis__AiQueueMax: "${AI_QUEUE_MAX:-8}"
      Analysis__AiDailyPerCaller: "${AI_DAILY_PER_CALLER:-20}"
      Analysis__AiDailyGlobal: "${AI_DAILY_GLOBAL:-200}"
      Storage__Root: "/app/data"
      Persistence__Provider: "file"
      # 公共门面的分析任务依赖已迁移 PostgreSQL；G-code 文件仓库仍使用 /app/data。
      Shares__Provider: "${CSHARP_SHARES_PROVIDER:-postgres}"
      Datasources__Provider: "${CSHARP_DATASOURCES_PROVIDER:-postgres}"
      Knowledge__Provider: "${CSHARP_KNOWLEDGE_PROVIDER:-postgres}"
      Calibrations__Provider: "${CSHARP_CALIBRATIONS_PROVIDER:-postgres}"
      AnalysisTasks__Provider: "postgres"
      POSTGRES_URL: "${POSTGRES_URL:?Set a migrated PostgreSQL connection URL}"
      InternalAuth__SharedSecret: "${GCODE_AUTHORITY_INTERNAL_SECRET:?Set a random secret of at least 32 bytes}"
      InternalAuth__PreviousSharedSecret: "${GCODE_AUTHORITY_INTERNAL_SECRET_PREVIOUS:-}"
      GCodeJobs__QueueCapacity: "${GCODE_JOB_QUEUE_CAPACITY:-64}"
      GCodeJobs__Admission__MaxActivePerOwner: "${GCODE_JOB_MAX_ACTIVE_PER_OWNER:-4}"
      GCodeJobs__Admission__MaxActivePerTenant: "${GCODE_JOB_MAX_ACTIVE_PER_TENANT:-16}"
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft.AspNetCore: "Warning"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8787/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  forgex:
    profiles: [legacy-node]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: "${FORGEX_NODE_IMAGE:-forgex-insight:local}"
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      forgex-api:
        condition: service_healthy
    ports:
      - "${FORGEX_LEGACY_PORT:-8786}:8787"
    volumes:
      - forgex-node-data:/app/data
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      NODE_ENV: "production"
      DATA_DIR: "/app/data"
      PERSISTENCE_PROVIDER: "${PERSISTENCE_PROVIDER:-postgres}"
      POSTGRES_URL: "${POSTGRES_URL:?Set a migrated PostgreSQL connection URL}"
      POSTGRES_POOL_MAX: "${POSTGRES_POOL_MAX:-10}"
      POSTGRES_SSL: "${POSTGRES_SSL:-0}"
      LOG_LEVEL: "info"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      API_KEYS: "${API_KEYS:-}"
      CALIBRATION_REVIEW_KEYS: "${CALIBRATION_REVIEW_KEYS:-}"
      REQUIRE_AUTH: "${REQUIRE_AUTH:-0}"
      PUBLIC_BASE: "${PUBLIC_BASE:-}"
      ALLOW_ORIGINS: "${ALLOW_ORIGINS:-}"
      ANALYSIS_PROVIDER: "${ANALYSIS_PROVIDER:-auto}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      GCODE_AUTHORITY_URL: "http://forgex-api:8787"
      GCODE_AUTHORITY_ALLOW_REMOTE: "1"
      GCODE_AUTHORITY_INTERNAL_SECRET: "${GCODE_AUTHORITY_INTERNAL_SECRET:?Set a random secret of at least 32 bytes}"
      GCODE_ASYNC_JOBS_ENABLED: "1"
      # 观察期回滚网关复用 C# 数据与身份，保留各资源的迁移期开关。
      SHARES_AUTHORITY: "${SHARES_AUTHORITY:-csharp}"
      DATASOURCES_AUTHORITY: "${DATASOURCES_AUTHORITY:-csharp}"
      KNOWLEDGE_AUTHORITY: "${KNOWLEDGE_AUTHORITY:-csharp}"
      CALIBRATION_GOVERNANCE_AUTHORITY: "${CALIBRATION_GOVERNANCE_AUTHORITY:-csharp}"
      # 包括 AI 创建、读取与 SSE 均经 C#，同一 POSTGRES_URL 保持任务历史。
      ANALYSIS_TASKS_AUTHORITY: "${ANALYSIS_TASKS_AUTHORITY:-csharp}"
      AI_CONCURRENCY: "2"
      AI_QUEUE_MAX: "8"
      AI_DAILY_PER_CALLER: "20"
      AI_DAILY_GLOBAL: "200"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  forgex-node-data:
  forgex-authority-data:
